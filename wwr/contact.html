<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Brian Khumalo">
    <meta name="description"
      content="This will be the contact page for the Khumalo White Water Rafting page where clients and potential clients will be able to connect with us and ask about services.">
    <title>Contact Us | Khumalo White Water Rafting | WDD 130</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/wwr-logo.jpg" alt="company logo" width="150">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <aside class="address">
            <h1>Khumalo White Water Rafting Company</h1>
            <p>123 Pumula South, Bulawayo, Zimbabwe</p>
            <p>+263 78 385 4279</p>
            <p>khvmalo_brian@yahoo.com</p>
        </aside>

        <section class="feedback-map">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d2144.3139774625697!2d28.48500586836425!3d-20.156252912143106!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2szw!4v1791344009824!5m2!1sen!2szw"
              width="375" height="312" style="border:0;" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <section class="form-section">
                <form>
                    <div class="user-info">
                        <label for="name">Name: </label>
                        <input type="text" id="name" name="name" placeholder="Brian...">
                    </div>
                    <div class="user-info">
                        <label for="email">Email: </label>
                        <input type="email" id="email" name="email" placeholder="jkhkdhk@gmail.com">
                    </div>
                    <section class="radio">
                        <p>Message Purpose: </p>
                        <div>
                            <input type="radio" id="inquiry" name="message" value="inquiry">
                            <label for="inquiry">General Inquiry</label>
                        </div>
                        <div>
                            <input type="radio" id="question" name="message" value="question">
                            <label for="question">Reservation Question</label>
                        </div>

                        <div>
                            <input type="radio" id="suggestion" name="message" value="suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </section>>
                    <div>
                        <label for="feedback">Enter Message: </label>
                        <textarea name="feedback" id="feedback" rows="4"
                          placeholder="type here..."></textarea>
                    </div>
                    <div>
                        <input type="checkbox" id="sub" name="sub">
                        <label for="sub">Please subscribe to monthly Newsletter</label>
                    </div>

                    <button type="submit">Get In Touch</button>
                </form>
            </section>
        </section>

        <section class="adventure">
            <h2>
                Adventure Awaits You!
            </h2>
            <figure>
                <img src="images/figure1.jpg" alt="enjoying rafting">
                <figcaption>Morning Glory</figcaption>
            </figure>

            <figure>
                <img src="images/figure2.jpg" alt="blue and yellow oar">
                <figcaption>The Wall</figcaption>
            </figure>
            <figure>
                <img src="images/figure3.jpg" alt="sight of the river">
                <figcaption>Two Worlds</figcaption>
            </figure>
            <figure>
                <img src="images/figure4.jpg" alt="rafting and enjoying clients">
                <figcaption>Oblivion</figcaption>
            </figure>
            <figure>
                <img src="images/figure5.jpg" alt="rafting boats">
                <figcaption>Terminator</figcaption>
            </figure>
        </section>

        <footer>
            <p>©️2026 | Khumalo White Water Rafting | Brian Khumalo</p>
            <nav class="socialmedia">
                <a href="https://fb.com" target="_blank">
                    <img src="images/fb-logo.svg" alt="facebook icon" width="30">
                </a>

                <a href="https://istagram.com" target="_blank">
                    <img src="images/insta-logo.svg" alt="instagram icon" width="30">
                </a>

                <a href="https://youtube.com" target="_blank">
                    <img src="images/yt-logo.svg" alt="youtube icon" width="30">
                </a>
            </nav>
        </footer>

    </main>

</body>


</html>
