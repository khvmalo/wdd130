<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic HTML structure example using semantic HTML elements.">
    <meta name="author" content="Brian Khumalo">
</head>

<body>
    <header>
        <img src="images/basic-logo.png" alt="basic html logo" width="128" height="128">
    </header>
    <nav>
        <ul>
            <li>
                <a href="https://fb.com">Facebook</a>
            </li>
            <li>
                <a href="https://instagram.com">Instagram</a>
            </li>
        </ul>
    </nav>
    <main>
        <h1>Basic HTML structure</h1>
        <section>
            <h2>Semantic HTML</h2>
            <p>These are HTML elements that do what the name describes for example 'header' and
                'nav' elements</p>
        </section>
        <section>
            <h2>Non-Semantic HTML</h2>
            <p>These don't do what is stated in the names, they are just elements fro example 'div'
            </p>
        </section>
    </main>
    <aside>
        <img
          src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/arequipa-peru/800x500/4-48661c257177c19a0f39a3991b1a7e7aa0338487.jpeg"
          alt="peru temple in the hills" width="200">
    </aside>
    <footer>
        <p>©️Brian Khumalo | 2026</p>
    </footer>

</body>

</html>
