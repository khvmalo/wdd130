<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>

    </header>

    <main>
        <h1>WDD 130 | Online Quiz | Brian Khumalo</h1>
        <form>
            <div>
                <label for="q1">1. What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div>
                <label for="q2">2. How are id and class attributes selected in CSS?</label>
                <textarea name="q2" id="q2" rows="4"></textarea>
            </div>

            <div>
                <label for="q3">3. What is a part of web development?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>select...</option>
                    <option value="1">CSS</option>
                    <option value="2">C++</option>
                    <option value="3">Dictionaries</option>
                </select>
            </div>

            <div class="q4">
                <label for="q4">4. What is the bottom margin given this declaration?</label>
                <code class="black-box">margin: 10px 5px 15px</code>
                <input type="number" id="q4" name="q4">
            </div>

            <button type="submit">Submit Quiz</button>
        </form>

    </main>

</body>

</html>
