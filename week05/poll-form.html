<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/poll-form.css">
    <title>Poll Form</title>
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item column2">
                    <label for="fullname">Full Name: </label>
                    <input type="text" id="fullname" name="fullname">
                </div>
                <div class="form-item column2">
                    <label for="useremail">Email: </label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
            </fieldset>
            <fieldset>
                <legend>Questions?</legend>
                <div class="form-item column1">
                    <label for="browser">What is your favorite browser</label>
                    <select name="browser" id="browser">
                        <option value="1">Chrome</option>
                        <option value="2">Edge</option>
                        <option value="3">Opera</option>
                    </select>
                </div>
                <div class="form-item checkbox">
                    <label for="pet">Do you have a pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>
                <label for="feedback">List all the places you've lived: </label>
                <textarea name="feedback" id="feedback" placeholder="Bulawayo, Zimbabwe"
                  rows="4"></textarea>
            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        <p>©️2026 | HTML Form - User Poll | Brian Khumalo</p>
    </footer>
</body>

</html>
